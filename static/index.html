<!DOCTYPE html>
<html>
<head>
        <meta charset="UTF-8">
        <title>SunGuidance</title>
</head>
<body>
    <h1>Welcome to SunGuidance</h1>
    <p>Click the button to get your coordinates!</p>

    <button onclick="getLocation()">Co-ord finder</button>

    <p id="userLocation"></p>

    <div id="manual-input-container" style="display: none; margin-top: 15px;">
        <p><strong>Could not retrieve location automatically. Please enter manually:</strong></p>
        <input type="number" id="lat" placeholder="Latitude (e.g. 53.360001)" min="-90" max="90" step="any">
        <input type="number" id="lon" placeholder="Longitude (e.g. -6.325000)" min="-180" max="180" step="any">
        <button onclick="submitManualCoords()">Submit Coordinates</button>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
